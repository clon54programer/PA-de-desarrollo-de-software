services:
  web:
    build: .
    container_name: pa_python_app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DJANGO_SUPERUSER_USERNAME=admin
      - DJANGO_SUPERUSER_EMAIL=admin@example.com
      - DJANGO_SUPERUSER_PASSWORD=adminpass
    stdin_open: true
    tty: true
    networks:
      - pa_network
    command: >
      sh -c "python src/manage.py makemigrations polls && python src/manage.py migrate && python src/manage.py createsuperuser --noinput
      && python src/manage.py runserver 0.0.0.0:8000"

networks:
  pa_network:
    driver: bridge