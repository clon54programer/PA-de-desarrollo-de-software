{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/my_styles.css' %}">
</head>

<body>

    <div class="container-md" id="cont">

        <nav class="navbar bg-body-tertiary">
            <div class="container-fluid">
                <h1 class="navbar-brand" href="#">CyberNet: Los riesgos cibernéticos no esperan, ¡protégete de las
                    amenazas!</h1>
                <form action="{% url 'logout' %}" method="post" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">
                        Cerrar Sesión
                    </button>
                </form>
            </div>
        </nav>
        <h2 class="text-center">{{message}}</h2>



        <div id="actions">
            <h2>Acciones</h2>
            <div class="row justify-content-around">
                <div class="col-4">
                    <button type="button" class="btn btn-info"> <a
                            class="link-light link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover"
                            href="/scan">Realizar un
                            escaneo</a></button>
                </div>

                <div class="col-4"><button type="button" class="btn btn-info"><a
                            class="link-light link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover"
                            href="/result">Ver
                            resultados</a></button></div>
            </div>

        </div>

    </div>


</body>

</html>
