<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
</head>

<body>

    <div>
        <h1>Formulario</h1>
        <form action="scan" method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Enviar</button>
        </form>
        <p>{{message}}</p>

    </div>
    <a href="{% url 'index' %}">Volver a home</a>
</body>

</html>
