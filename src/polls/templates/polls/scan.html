{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>

<body class="bg-light"> <!-- Fondo gris claro para resaltar el formulario -->

    <div class="container-md mt-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="card shadow"> <!-- Tarjeta para contener el formulario -->
                    <div class="card-header bg-primary text-white text-center">
                        <h2 class="mb-0">Escaner de Vulnerabilidades</h2>
                    </div>

                    <div class="card-body p-4">
                        <form action="scan" method="post">
                            {% csrf_token %}

                            {% for field in form %}
                            <div class="mb-3 text-start">
                                <label for="{{ field.id_for_label }}" class="form-label fw-bold">
                                    {{ field.label }}
                                </label>

                                {{ field }}

                                {% if field.help_text %}
                                <div class="form-text text-muted">
                                    {{ field.help_text }}
                                </div>
                                {% endif %}

                                {% if field.errors %}
                                <div class="text-danger small">
                                    {{ field.errors }}
                                </div>
                                {% endif %}
                            </div>
                            {% endfor %}

                            <div class="d-grid gap-2"> <!-- Botón de ancho completo -->
                                <button type="submit" class="btn btn-primary btn-lg">
                                    Iniciar Escaneo
                                </button>
                            </div>
                        </form>

                        {% if message %}
                        <div class="alert alert-info mt-3" role="alert">
                            {{ message }}
                        </div>
                        {% endif %}
                    </div>

                    <div class="card-footer text-center py-3">
                        <a href="{% url 'index' %}" class="btn btn-outline-secondary btn-sm">
                            Volver a Home
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>


</body>

</html>
