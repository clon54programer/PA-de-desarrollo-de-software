<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
</head>

<body>

    {% if is_null %}
    <h1>No existen resultados</h1>
    {% else %}
    {% for result in results %}
    <table>
        <tr>
            <th>Dominio</th>
            <th>fecha</th>
            <th>Servicio</th>

        </tr>
        <tr>
            <td>{{result.dominio}}</td>
            <td>{{result.fecha}}</td>
            <td><a href="{% url 'service_result' %}?service_id={{result.servicio.id}}">Ver servicios detectados</a></td>
        </tr>


    </table>

    {% endfor %}
    {% endif %}


    <a href="{% url 'scan' %}">realizar un nuevo scan</a>
</body>

</html>
